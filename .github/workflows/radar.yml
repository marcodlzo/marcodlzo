name: Radar

# Redraws the radar charts whenever assets/radar.json (or the script) changes.
on:
  push:
    branches: [main]
    paths:
      - assets/radar.json
      - scripts/radar.py
      - scripts/theme.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw radars
        run: python scripts/radar.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/radar-*.svg
            git commit -m "chore: redraw radar charts"
            git push
          else
            echo "No changes."
          fi
