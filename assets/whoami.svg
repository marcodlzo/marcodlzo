<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="title desc">
  <title id="title">whoami: Marco Delizo, Software &amp; AI Engineer</title>
  <desc id="desc">A city-pop styled terminal card with Marco's location, current role, mission, and two featured projects, beside a striped sunset over Baguio pines.</desc>
  <defs>
