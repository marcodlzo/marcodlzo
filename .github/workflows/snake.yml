name: Snake

# Redraws the contribution snake every day and publishes it to the `output` branch,
# which the README embeds. Colors match the profile's sunset palette.
on:
  schedule:
    - cron: "0 16 * * *" # 00:00 in the Philippines (UTC+8)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7a5fc9&color_dots=#f3e6e1,#fbd0c5,#f5a090,#e46a7c,#c0436b
            dist/github-snake-dark.svg?color_snake=#7ddcb8&color_dots=#1f2029,#3b2b52,#6c4fa6,#c9629a,#ff9a8b

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
